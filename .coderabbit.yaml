# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit Configuration
# Full reference: https://docs.coderabbit.ai/reference/configuration

tone_instructions: >-
  Act as a senior KubeVirt operator and controller engineer: professional, constructive
  feedback only. Serious about CRD API compatibility, template substitution
  correctness, generated-code hygiene, and test coverage. Flag issues with
  file/line refs. End positively.

reviews:
  high_level_summary: false
  auto_title_placeholder: ""
  review_status: false
  commit_status: false
  changed_files_summary: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  path_filters:
    - "!**/vendor/**"
    - "!**/zz_generated.*"
    - "!**/_out/**"
    - "!**/bin/**"
    - "!cover.out"
  slop_detection:
    enabled: false
  auto_review:
    auto_pause_after_reviewed_commits: 10
    ignore_title_keywords:
      - "WIP"
    labels:
      - "!do-not-merge/work-in-progress"
    ignore_usernames:
      - "kubevirt-bot"
      - "renovate[bot]"
      - "dependabot[bot]"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

chat:
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  code_guidelines:
    enabled: true
  learnings:
    scope: global
  issues:
    scope: global
  jira:
    usage: disabled
  linear:
    usage: disabled
  pull_requests:
    scope: global
  mcp:
    usage: disabled
  linked_repositories:
    - repository: "kubevirt/kubevirt"
      instructions: >-
        Core virtualization platform. virt-template processes
        VirtualMachineTemplate CRs into KubeVirt VirtualMachine objects.
        Use to verify VirtualMachine/VirtualMachineInstance API fields,
        instance types/preferences, DataVolume-related VM spec behavior,
        and VirtualMachineSnapshot/VirtualMachineSnapshotContent APIs used
        in the snapshot→clone pipeline.
    - repository: "kubevirt/virt-template-api"
      instructions: >-
        Published mirror of this repo's ./api module (public API types).
        Cross-reference for the canonical
        VirtualMachineTemplate/VirtualMachineTemplateRequest type
        definitions.
    - repository: "kubevirt/virt-template-client-go"
      instructions: >-
        Published mirror of this repo's
        staging/src/kubevirt.io/virt-template-client-go module (generated
        typed client). Verify generated client changes stay in sync with
        API type changes.
    - repository: "kubevirt/virt-template-engine"
      instructions: >-
        Published mirror of this repo's
        staging/src/kubevirt.io/virt-template-engine module (parameter
        substitution/generation engine). Use for template-processing
        semantics.
    - repository: "kubevirt/containerized-data-importer"
      instructions: >-
        CDI project providing DataVolume and DataSource APIs. Used by
        virt-template's VirtualMachineTemplateRequest controller to clone
        volumes during the snapshot→clone→expand pipeline. Reference for
        DataVolume spec fields, clone strategies, and PVC binding behavior.
    - repository: "kubevirt/enhancements"
      instructions: >-
        Contains VEP design documents. When a PR references a VEP number,
        locate the corresponding vep.md and verify the implementation
        aligns with the stated API shape, phasing plan, and non-goals.

issue_enrichment:
  planning:
    enabled: false
    auto_planning:
      enabled: false
